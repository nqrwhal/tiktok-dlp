name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          # Root tests import a couple of web/*.ts helpers. Node 22.12–22.17 need
          # type stripping enabled; later 22.x keeps this flag as a no-op/warning.
          NODE_OPTIONS: --experimental-strip-types
