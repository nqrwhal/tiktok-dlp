name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
        env:
          # Root tests import a couple of web/*.ts helpers. Node 22.12–22.17 need
          # type stripping enabled; later 22.x keeps this flag as a no-op/warning.
          NODE_OPTIONS: --experimental-strip-types

      - name: Check JavaScript syntax
        run: find src test scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check deployment script syntax
        run: bash -n scripts/deploy-prod.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet
        env:
          DISCORD_TOKEN: ci-placeholder
          DISCORD_CLIENT_ID: ci-placeholder
          PUBLIC_BASE_URL: https://downloads.example.test
          IMPORT_API_TOKEN: ci-placeholder
          REWIND_PUBLIC_URL: https://rewind.example.test

  web:
    name: Rewind lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit, integration, and production-build tests
        run: npm test

  browser:
    name: Rewind Chromium workflows
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser workflows
        run: npx playwright test --project=desktop-chromium --project=mobile-chromium

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Production image builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build backend and Rewind images
        run: docker compose build tiktok-discord-downloader rewind-web
        env:
          DISCORD_TOKEN: ci-placeholder
          DISCORD_CLIENT_ID: ci-placeholder
          PUBLIC_BASE_URL: https://downloads.example.test
          IMPORT_API_TOKEN: ci-placeholder
          REWIND_PUBLIC_URL: https://rewind.example.test
